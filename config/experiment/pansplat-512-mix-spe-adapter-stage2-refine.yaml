# @package _global_

defaults:
  - /model: pansplat
  - override /loss: [mse, lpips, pyimage]
  - override /dataset: mix

wandb:
  name: pansplat-512-mix-spe-adapter-stage2-refine
  tags: [pansplat, mix, 512x1024, spherical-pe, adapter, stage2, partial-unfreeze]

data_loader:
  train:
    batch_size: 1
    num_workers: 6
  val:
    batch_size: 1
  test:
    batch_size: 1

trainer:
  max_epochs: 20
  val_check_interval: 0.5
  precision: 16-mixed

optimizer:
  lr: 1.e-4

model:
  weights_path: null
  decoder:
    view_batch: 2
  encoder:
    fpn_max_height: 512
    freeze_mvs: false
    freeze_backbone: true
    backbone_position_embedding_type: "spherical"
    backbone_position_embedding_hidden_dim: 128
    backbone_use_feature_adapter: true
    backbone_feature_adapter_hidden_dim: 64
    backbone_trainable_modules:
      - transformer
      - encoder.downsample3
      - encoder.conv30
      - encoder.conv31
    gaussian_head:
      deferred_blend: true
      patchs_height: 2
      patchs_width: 2

dataset:
  image_shape: [512, 1024]
  train_times_per_scene: 400
  cache_images: false

loss:
  pyimage:
    decoder:
      view_batch: 2
    gaussian_head:
      patchs_height: 2
      patchs_width: 2
