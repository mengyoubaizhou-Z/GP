# @package _global_

defaults:
  - /experiment/ablate-256-baseline
  - _self_

wandb:
  name: ablate-256-A-B
  mode: offline
  tags: [ablation, 256x512, mix_0, A, B]

model:
  encoder:
    # A1: 球面位置编码
    backbone_position_embedding_type: "spherical"
    backbone_position_embedding_hidden_dim: 128

    # A2: 主干网络全景特征适配
    freeze_backbone: true
    backbone_use_feature_adapter: false
    backbone_transformer_adapter_type: "mona_multi"
    backbone_transformer_adapter_hidden_dim: 64
    backbone_transformer_adapter_cross_hidden_dim: 128
    backbone_transformer_adapter_kernel_sizes: [3, 5, 7]
    backbone_transformer_adapter_fusion: "weighted_sum"
    backbone_transformer_adapter_use_pointwise: true
    backbone_transformer_adapter_use_inner_residual: true
    backbone_transformer_adapter_dropout: 0.1
    backbone_trainable_modules:
      - transformer
      - encoder.downsample3
      - encoder.conv30
      - encoder.conv31

    # A3: 球面一致 ERP 特征采样 / 球面代价体
    use_spherical_cost_volume_warp: true

    gaussian_head:
      # B1: 经纬度位置嵌入
      use_latlon_embedding: true
      latlon_embedding_freqs: 2

      # B2: 纬度尺度感知卷积
      use_latitude_aware_conv: true
      latitude_aware_conv_freqs: 2
      latitude_aware_dilations: [1, 2, 4]

      # B3: 局部投影雅可比高斯参数化
      gaussian_adapter:
        use_jacobian_aware_scale: true
        use_jacobian_aware_basis: true
        return_world_space_rotations: true
        jacobian_scale_multiplier: 0.1
        jacobian_scale_radial_factor: 0.5

loss:
  pyimage:
    gaussian_head:
      use_latlon_embedding: true
      latlon_embedding_freqs: 2
      use_latitude_aware_conv: true
      latitude_aware_conv_freqs: 2
      latitude_aware_dilations: [1, 2, 4]
      gaussian_adapter:
        use_jacobian_aware_scale: true
        use_jacobian_aware_basis: true
        return_world_space_rotations: true
        jacobian_scale_multiplier: 0.1
        jacobian_scale_radial_factor: 0.5