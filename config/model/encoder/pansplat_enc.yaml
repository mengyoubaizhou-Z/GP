name: pansplat_enc

fpn_stages: 4
mvs_stages: 3
fpn_max_height: 512

num_depth_candidates: [128, 64, 32, 16]

gaussian_head:
  num_surfaces: 1
  gaussians_per_pixel: 1
  geo_condition:
    enable: false
    mode: "concat"
    channels: ["reproj", "photo", "conflict", "valid"]
    detach_inputs: true
    invalid_reliability: 0.5
  opacity_mapping:
    initial: 0.0
    final: 0.0
    warm_up: 1
  wo_pgs: false
  wo_pgs_res: false
  gh_mvs_scale_factor: null
  unify_gh_res: false
  wo_disp_dens_refine: false
  wo_fibo_gs: false
  wo_sh_res: false
  wo_feat: false
  use_latlon_embedding: true
  latlon_embedding_freqs: 2
  use_latitude_aware_conv: true
  latitude_aware_conv_freqs: 2
  latitude_aware_dilations: [1, 2, 4]
  fibo_mlp_layers: 1
  gh_cnn_layers: 3
  patchs_height: 1
  patchs_width: 1
  gaussian_adapter:
    gaussian_scale_min: 0.5
    gaussian_scale_max: 15.0
    sh_degree: 4
    use_jacobian_aware_scale: true
    use_jacobian_aware_basis: true
    return_world_space_rotations: true
    jacobian_scale_multiplier: 0.1
    jacobian_scale_radial_factor: 0.5
  deferred_blend: false

geometry_reliability:
  enable: false
  compute_in_train: true
  compute_in_eval: true
  sigma_depth: 0.03
  depth_error_type: "relative"
  occlusion_margin: 0.03
  min_depth: 1.0e-3
  far_depth_margin: 0.98
  invalid_reliability: 0.5
  detach: true
  aggregate: "min"
  return_debug: true

d_feature: [128, 96, 64, 32]

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

# params for multi-view depth predictor
unimatch_weights_path: "checkpoints/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth"
multiview_trans_attn_split: 2
costvolume_unet_feat_dims: [128, 64, 32, 16]
costvolume_unet_channel_mult: [1,1,1]
costvolume_unet_attn_res: [4]
use_spherical_cost_volume_warp: true
shim_patch_size: 4

# below are ablation settings, keep them as false for default model
wo_backbone_cross_attn: false  # Table 3: w/o cross-view attention

wo_gbp: true

wo_mono_depth: false

mono_depth:
  num_layers: 18
  equi_h: 512
  equi_w: 1024
  pretrained: false
  max_depth: 10.0
  fusion_type: cee
  se_in_fusion: false
  mono_uncertainty: false
  mono_lowres_pred: false

unifuse_pretrained_path: "checkpoints/unifuse_pretrained.pth"
habitat_monodepth_path: "checkpoints/habitat_monodepth.pt"
use_wrap_padding: true
freeze_mvs: false
freeze_backbone: false
backbone_position_embedding_type: "sine"
backbone_position_embedding_hidden_dim: null
backbone_use_feature_adapter: false
backbone_feature_adapter_hidden_dim: null
backbone_transformer_adapter_type: "none"
backbone_transformer_adapter_hidden_dim: null
backbone_transformer_adapter_cross_hidden_dim: null
backbone_transformer_adapter_kernel_size: 3
backbone_transformer_adapter_kernel_sizes: null
backbone_transformer_adapter_fusion: "weighted_sum"
backbone_transformer_adapter_use_pointwise: false
backbone_transformer_adapter_use_inner_residual: false
backbone_transformer_adapter_dropout: 0.1
backbone_trainable_modules: null
